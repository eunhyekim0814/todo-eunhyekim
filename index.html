<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <style>
    :root {
      --bg: #e0f2fe;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --accent: #2563eb;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c2a3e;
        --card: #292524;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --line: #44403c;
        --accent: #60a5fa;
        --danger: #f87171;
        --danger-bg: #3b1d1d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
    }
    main {
      max-width: 480px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .subtitle { margin: 0 0 16px; font-size: 0.85rem; color: var(--muted); }
    form { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
    }
    form input#author { flex: 0 0 88px; }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .add {
      padding: 10px 20px;
      background: #2563eb;
      color: #fff;
      border-radius: 999px;
    }
    .add:hover:not(:disabled) { background: #1d4ed8; }
    .error {
      margin: 16px 0 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--danger-bg);
      color: var(--danger);
      font-size: 0.9rem;
      word-break: break-word;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 16px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .filters { display: flex; gap: 4px; }
    .filters button {
      padding: 4px 10px;
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
    }
    .filters button.active {
      color: var(--accent);
      border-color: var(--accent);
    }
    ul { list-style: none; margin: 8px 0 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    li > input[type="checkbox"] { width: 18px; height: 18px; flex: none; }
    li .text { flex: 1; word-break: break-word; cursor: text; }
    li.done .text { text-decoration: line-through; color: var(--muted); }
    li .author {
      flex: none;
      max-width: 96px;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--bg);
      color: var(--muted);
      font-size: 0.8rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    li input.edit { padding: 4px 8px; }
    .delete {
      padding: 4px 10px;
      background: transparent;
      color: var(--danger);
    }
    .empty { margin: 16px 0 0; color: var(--muted); text-align: center; }
    .hint { margin: 16px 0 0; font-size: 0.8rem; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>은혜 킴의 할 일 목록</h1>
    <p class="subtitle">은혜F의 할 일</p>
    <form id="form">
      <input id="input" type="text" placeholder="할 일을 입력하세요" autocomplete="off">
      <input id="author" type="text" placeholder="작성자" maxlength="20" autocomplete="off" aria-label="작성자 (선택)">
      <button id="add" class="add" type="submit">추가</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <span id="count"></span>
      <div class="filters">
        <button type="button" data-filter="all">전체</button>
        <button type="button" data-filter="active">할 일</button>
        <button type="button" data-filter="done">완료</button>
      </div>
    </div>

    <ul id="list"></ul>
    <p id="empty" class="empty"></p>
    <p class="hint">글자를 더블클릭하면 수정할 수 있어요.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const authorInput = document.getElementById('author');
    const addButton = document.getElementById('add');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const count = document.getElementById('count');
    const errorBox = document.getElementById('error');
    const filterButtons = document.querySelectorAll('.filters button');

    let db = null;
    let todos = [];
    let filter = 'all';
    let loading = true;

    function showError(message, error) {
      errorBox.textContent = error ? `${message} (${error.message})` : message;
      errorBox.hidden = false;
      if (error) console.error(message, error);
    }

    function clearError() {
      errorBox.hidden = true;
      errorBox.textContent = '';
    }

    // RLS 때문에 막히면 오류 없이 0개만 바뀔 수 있어서, 바뀐 개수도 확인한다.
    function failed(message, { data, error }) {
      if (error) {
        showError(message, error);
        return true;
      }
      if (!data || data.length === 0) {
        showError(`${message} (권한이 없거나 이미 지워진 할 일이에요.)`);
        return true;
      }
      return false;
    }

    async function loadTodos() {
      loading = true;
      render();
      const { data, error } = await db
        .from('todos')
        .select('id, text, done, author')
        .order('created_at')
        .order('id');
      loading = false;
      if (error) {
        showError('할 일을 불러오지 못했어요.', error);
      } else {
        todos = data;
      }
      render();
    }

    async function addTodo(text, author) {
      clearError();
      addButton.disabled = true;
      const result = await db
        .from('todos')
        .insert({ text, author })
        .select('id, text, done, author');
      addButton.disabled = false;
      if (failed('할 일을 추가하지 못했어요.', result)) return false;
      todos.push(result.data[0]);
      render();
      return true;
    }

    async function updateTodo(todo, changes, message) {
      clearError();
      const result = await db
        .from('todos')
        .update(changes)
        .eq('id', todo.id)
        .select('id');
      if (!failed(message, result)) Object.assign(todo, changes);
      render();
    }

    async function deleteTodo(todo) {
      clearError();
      const result = await db
        .from('todos')
        .delete()
        .eq('id', todo.id)
        .select('id');
      if (!failed('할 일을 지우지 못했어요.', result)) {
        todos = todos.filter((t) => t !== todo);
      }
      render();
    }

    function startEdit(item, label, todo) {
      const editor = document.createElement('input');
      editor.type = 'text';
      editor.className = 'edit';
      editor.value = todo.text;

      let finished = false;
      function finish(keep) {
        if (finished) return;
        finished = true;
        const text = editor.value.trim();
        if (keep && text && text !== todo.text) {
          updateTodo(todo, { text }, '할 일을 수정하지 못했어요.');
        } else {
          render();
        }
      }

      editor.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') finish(true);
        if (event.key === 'Escape') finish(false);
      });
      editor.addEventListener('blur', () => finish(true));

      item.replaceChild(editor, label);
      editor.focus();
      editor.select();
    }

    function render() {
      list.innerHTML = '';

      const visible = todos.filter((todo) =>
        filter === 'all' ? true : filter === 'done' ? todo.done : !todo.done
      );

      for (const todo of visible) {
        const item = document.createElement('li');
        item.classList.toggle('done', todo.done);

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.addEventListener('change', () => {
          updateTodo(todo, { done: checkbox.checked }, '완료 표시를 바꾸지 못했어요.');
        });

        const label = document.createElement('span');
        label.className = 'text';
        label.textContent = todo.text;
        label.addEventListener('dblclick', () => startEdit(item, label, todo));

        item.append(checkbox, label);

        if (todo.author) {
          const author = document.createElement('span');
          author.className = 'author';
          author.textContent = todo.author;
          author.title = `작성자: ${todo.author}`;
          item.append(author);
        }

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'delete';
        remove.textContent = '삭제';
        remove.addEventListener('click', () => deleteTodo(todo));

        item.append(remove);
        list.append(item);
      }

      const remaining = todos.filter((todo) => !todo.done).length;
      count.textContent = `남은 할 일 ${remaining}개`;

      empty.hidden = visible.length > 0;
      empty.textContent =
        loading ? '불러오는 중...' :
        todos.length === 0 ? '아직 할 일이 없어요.' :
        filter === 'done' ? '완료한 일이 없어요.' : '남은 할 일이 없어요.';

      filterButtons.forEach((button) => {
        button.classList.toggle('active', button.dataset.filter === filter);
      });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || !db) return;
      const author = authorInput.value.trim() || null;
      if (await addTodo(text, author)) input.value = '';
      input.focus();
    });

    filterButtons.forEach((button) => {
      button.addEventListener('click', () => {
        filter = button.dataset.filter;
        render();
      });
    });

    if (!window.supabase) {
      loading = false;
      render();
      showError('Supabase 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
    } else if (typeof SUPABASE_URL === 'undefined') {
      loading = false;
      render();
      showError('config.js를 불러오지 못했어요.');
    } else {
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      loadTodos();
    }
  </script>
</body>
</html>
