<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <style>
    :root {
      --bg: #e6f4dc;
      --sky-top: #a9dcff;
      --sky-bottom: #e4f6ff;
      --hill-back: #a3d97c;
      --hill-front: #6dbb4a;
      --flower-opacity: 0.85;
      --card: rgba(255, 255, 255, 0.5);
      --card-border: rgba(255, 255, 255, 0.85);
      --field: rgba(255, 255, 255, 0.75);
      --text: #1c1917;
      --muted: #78716c;
      --line: rgba(40, 80, 120, 0.18);
      --accent: #2563eb;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #2e3b2f;
        --card: rgba(15, 31, 61, 0.5);
        --card-border: rgba(255, 255, 255, 0.18);
        --field: rgba(15, 31, 61, 0.6);
        --text: #f5f5f4;
        --muted: #a8a29e;
        --line: rgba(255, 255, 255, 0.16);
        --accent: #60a5fa;
        --danger: #f87171;
        --danger-bg: #3b1d1d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 48px 16px 26vh;
      background: var(--hill-front);
      color: var(--text);
      font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif;
      overflow-x: hidden;
    }
    .board {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
    }
    .glass {
      background: var(--card);
      border: 1px solid var(--card-border);
      -webkit-backdrop-filter: blur(10px) saturate(1.2);
      backdrop-filter: blur(10px) saturate(1.2);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    /* ---- 할 일 카드 오른쪽의 서울 날씨 ---- */
    .weather {
      position: absolute;
      top: 0;
      left: calc(100% + 16px);
      width: 136px;
      padding: 16px 12px;
      text-align: center;
    }
    .weather-icon { font-size: 44px; line-height: 1.15; }
    .weather-temp { margin-top: 4px; font-size: 1.8rem; font-weight: 700; }
    .weather-desc { font-size: 0.9rem; }
    .weather-meta { margin-top: 6px; font-size: 0.75rem; color: var(--muted); }
    @media (max-width: 819px) {
      .weather {
        position: static;
        display: flex;
        align-items: center;
        gap: 10px;
        width: fit-content;
        margin: 0 0 12px auto;
        padding: 8px 14px;
        text-align: left;
      }
      .weather-icon { font-size: 28px; }
      .weather-temp { margin: 0; font-size: 1.25rem; }
      .weather-meta { margin: 0; }
    }

    main {
      position: relative;
      background: var(--card);
      border: 1px solid var(--card-border);
      -webkit-backdrop-filter: blur(10px) saturate(1.2);
      backdrop-filter: blur(10px) saturate(1.2);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    /* ---- 초록 들판 ---- */
    .scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background: linear-gradient(var(--sky-top), var(--sky-bottom) 55%);
    }

    /* ---- 서울 시간에 따른 하늘 (sky.js가 <html data-phase>를 바꾼다) ---- */
    :root {
      --sun-x: 30%; --sun-y: 16%; --sun-color: #fff3a0; --sun-glow: rgba(255, 230, 120, 0.6); --sun-opacity: 1;
      --moon-x: 75%; --moon-y: 12%; --moon-opacity: 0;
      --star-opacity: 0;
      --cloud-opacity: 0.9;
    }
    :root[data-phase="dawn"] {
      --sky-top: #2c3e70; --sky-bottom: #f0a5a0;
      --hill-back: #6f9a6a; --hill-front: #4f7d4c; --flower-opacity: 0.5;
      --sun-opacity: 0; --moon-x: 80%; --moon-y: 18%; --moon-opacity: 0.6;
      --star-opacity: 0.4; --cloud-opacity: 0.6;
    }
    :root[data-phase="sunrise"] {
      --sky-top: #7fb6e8; --sky-bottom: #ffc58a;
      --hill-back: #8fc56f; --hill-front: #5fa645; --flower-opacity: 0.75;
      --sun-x: 15%; --sun-y: 52%; --sun-color: #ffcf6b; --sun-glow: rgba(255, 170, 80, 0.7);
      --cloud-opacity: 0.85;
    }
    :root[data-phase="day"] {
      --sky-top: #8fd0ff; --sky-bottom: #e4f6ff;
      --hill-back: #a3d97c; --hill-front: #6dbb4a; --flower-opacity: 0.85;
      --sun-x: 28%; --sun-y: 16%;
    }
    :root[data-phase="noon"] {
      --sky-top: #5fb8ff; --sky-bottom: #d8f1ff;
      --hill-back: #b0e07f; --hill-front: #74c64e; --flower-opacity: 0.9;
      --sun-x: 50%; --sun-y: 7%; --sun-color: #fffbd0; --sun-glow: rgba(255, 245, 170, 0.8);
    }
    :root[data-phase="afternoon"] {
      --sky-top: #79c0f5; --sky-bottom: #fff1cf;
      --hill-back: #a0d46f; --hill-front: #68b343; --flower-opacity: 0.85;
      --sun-x: 72%; --sun-y: 18%; --sun-color: #ffe98a; --sun-glow: rgba(255, 210, 110, 0.6);
    }
    :root[data-phase="sunset"] {
      --sky-top: #5d5fa8; --sky-bottom: #ff9a62;
      --hill-back: #7a9b55; --hill-front: #567d3d; --flower-opacity: 0.6;
      --sun-x: 84%; --sun-y: 50%; --sun-color: #ff8a4c; --sun-glow: rgba(255, 110, 60, 0.7);
      --star-opacity: 0.1; --cloud-opacity: 0.75;
    }
    :root[data-phase="night"] {
      --sky-top: #0f1f3d; --sky-bottom: #2b4a6f;
      --hill-back: #2f5a34; --hill-front: #234629; --flower-opacity: 0.4;
      --sun-opacity: 0; --moon-x: 76%; --moon-y: 14%; --moon-opacity: 1;
      --star-opacity: 0.8; --cloud-opacity: 0.35;
    }
    :root[data-phase="midnight"] {
      --sky-top: #050a1a; --sky-bottom: #121c3a;
      --hill-back: #1f3d24; --hill-front: #16301b; --flower-opacity: 0.25;
      --sun-opacity: 0; --moon-x: 50%; --moon-y: 9%; --moon-opacity: 1;
      --star-opacity: 1; --cloud-opacity: 0.25;
    }

    /* ---- 서울 날씨 (sky.js가 <html data-weather>를 바꾼다) ---- */
    :root { --cloud: #ffffff; --tint: #7d8794; --tint-opacity: 0; --clear-sky: 1; --fog-opacity: 0; }
    :root[data-weather="partly"] { --clear-sky: 0.8; }
    :root[data-weather="cloudy"] { --cloud: #e1e6ec; --tint-opacity: 0.3; --clear-sky: 0.15; }
    :root[data-weather="fog"] { --cloud: #eef1f4; --tint: #c9d0d8; --tint-opacity: 0.3; --clear-sky: 0.1; --fog-opacity: 0.75; }
    :root[data-weather="rain"] { --cloud: #b9c2cc; --tint-opacity: 0.42; --clear-sky: 0; }
    :root[data-weather="snow"] { --cloud: #e8edf2; --tint: #cfd8e3; --tint-opacity: 0.3; --clear-sky: 0.1; }
    :root[data-weather="thunder"] { --cloud: #9aa3ad; --tint: #4b5361; --tint-opacity: 0.5; --clear-sky: 0; }
    /* 어두운 시간에는 날씨 그늘과 친구들도 어둡게 */
    :root[data-phase="dawn"][data-weather],
    :root[data-phase="night"][data-weather],
    :root[data-phase="midnight"][data-weather] { --tint: #273142; }
    :root[data-phase="night"] #critters,
    :root[data-phase="midnight"] #critters { filter: brightness(0.82); }

    .stars {
      position: absolute;
      inset: 0 0 45% 0;
      opacity: calc(var(--star-opacity) * var(--clear-sky));
      background-image:
        radial-gradient(circle, #fff 0 1.2px, transparent 1.8px),
        radial-gradient(circle, #fff 0 0.8px, transparent 1.4px),
        radial-gradient(circle, #fffbe0 0 1.5px, transparent 2px);
      background-size: 120px 90px, 70px 60px, 190px 150px;
      background-position: 10px 15px, 40px 35px, 90px 60px;
      animation: twinkle 4s ease-in-out infinite alternate;
    }
    @keyframes twinkle { from { filter: brightness(0.7); } to { filter: brightness(1.2); } }
    .sun {
      position: absolute;
      left: var(--sun-x);
      top: var(--sun-y);
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--sun-color);
      box-shadow: 0 0 40px 18px var(--sun-glow);
      opacity: calc(var(--sun-opacity) * var(--clear-sky));
      transform: translate(-50%, -50%);
    }
    .moon {
      position: absolute;
      left: var(--moon-x);
      top: var(--moon-y);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      box-shadow: inset -13px -7px 0 0 #fdf3c4;
      filter: drop-shadow(0 0 10px rgba(253, 243, 196, 0.6));
      opacity: calc(var(--moon-opacity) * max(var(--clear-sky), 0.3));
      transform: translate(-50%, -50%) rotate(-20deg);
    }
    .cloud {
      position: absolute;
      left: -140px;
      width: 90px;
      height: 28px;
      border-radius: 999px;
      background: var(--cloud);
      opacity: var(--cloud-opacity);
      animation: drift 80s linear infinite;
    }
    .cloud::before, .cloud::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: inherit;
    }
    .cloud::before { width: 40px; height: 40px; left: 14px; top: -20px; }
    .cloud::after { width: 32px; height: 32px; left: 44px; top: -14px; }
    @keyframes drift { to { left: 110vw; } }
    .tint {
      position: absolute;
      inset: 0;
      background: var(--tint);
      opacity: var(--tint-opacity);
    }
    .fog {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(240, 243, 246, 0.95), rgba(240, 243, 246, 0.4) 60%, rgba(240, 243, 246, 0.6));
      opacity: var(--fog-opacity);
    }
    #weather-fx { position: absolute; inset: 0; overflow: hidden; }
    .drop {
      position: absolute;
      top: -20px;
      width: 2px;
      height: 16px;
      border-radius: 2px;
      background: rgba(210, 225, 245, 0.75);
      animation: fall 0.8s linear infinite;
    }
    @keyframes fall { to { transform: translate(-30px, 110vh); } }
    .flake {
      position: absolute;
      top: -12px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.9;
      animation: snow 7s linear infinite;
    }
    @keyframes snow {
      25% { transform: translate(12px, 27vh); }
      50% { transform: translate(-8px, 55vh); }
      75% { transform: translate(10px, 82vh); }
      100% { transform: translate(0, 110vh); }
    }
    .flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      animation: flash 8s linear infinite;
    }
    @keyframes flash {
      0%, 90%, 92.5%, 100% { opacity: 0; }
      91% { opacity: 0.6; }
      94% { opacity: 0.35; }
      95.5% { opacity: 0; }
    }
    .hills { position: absolute; left: 0; bottom: 0; width: 100%; height: 62vh; }
    .hills .back { fill: var(--hill-back); }
    .hills .front { fill: var(--hill-front); }
    .flowers {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34vh;
      opacity: var(--flower-opacity);
      background-image:
        radial-gradient(circle, #ffffff 0 2.5px, transparent 3px),
        radial-gradient(circle, #ffd84d 0 2.5px, transparent 3px),
        radial-gradient(circle, #ff9fb6 0 2px, transparent 2.5px);
      background-size: 90px 70px, 130px 90px, 110px 80px;
      background-position: 10px 20px, 50px 5px, 80px 45px;
    }

    /* ---- 돌아다니는 친구들 ---- */
    #critters { position: absolute; inset: 0; }
    .critter { position: absolute; left: 0; pointer-events: auto; cursor: pointer; }
    .critter.talking { z-index: 50 !important; }
    .critter svg, .runner svg { display: block; width: 100%; height: auto; overflow: visible; }
    .hop {
      transform-origin: 50% 100%;
      animation: breathe 2.4s ease-in-out infinite;
    }
    .critter.walking .hop { animation: hop 0.5s ease-in-out infinite; }
    .critter.talking .hop { animation: jump 0.45s ease-out 2; }
    @keyframes breathe {
      0%, 100% { transform: scale(1, 1); }
      50% { transform: scale(1.04, 0.96); }
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0) rotate(-4deg); }
      50% { transform: translateY(-7px) rotate(4deg); }
    }
    @keyframes jump {
      0%, 100% { transform: translateY(0); }
      40% { transform: translateY(-16px); }
    }
    .bubble {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      padding: 5px 11px;
      border: 2px solid #3a3a3a;
      border-radius: 14px;
      background: #fff;
      color: #3a3a3a;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.35;
      text-align: center;
      width: max-content;
      max-width: 180px;
      word-break: keep-all;
      opacity: 0;
      transform: translateX(calc(-50% + var(--shift, 0px))) scale(0);
      transform-origin: 50% 100%;
    }
    .bubble::after {
      content: "";
      position: absolute;
      left: calc(50% - var(--shift, 0px));
      top: 100%;
      width: 8px;
      height: 8px;
      margin: -4px 0 0 -5px;
      border: solid #3a3a3a;
      border-width: 0 2px 2px 0;
      background: #fff;
      transform: rotate(45deg);
    }
    .bubble.show { animation: pop var(--say, 2.2s) ease-out forwards; }
    @keyframes pop {
      0% { opacity: 0; transform: translateX(calc(-50% + var(--shift, 0px))) scale(0); }
      8% { opacity: 1; transform: translateX(calc(-50% + var(--shift, 0px))) scale(1.15); }
      14%, 88% { opacity: 1; transform: translateX(calc(-50% + var(--shift, 0px))) scale(1); }
      100% { opacity: 0; transform: translateX(calc(-50% + var(--shift, 0px))) scale(0.85); }
    }

    /* ---- 할 일을 추가하면 우르르 ---- */
    #rush {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
    }
    .runner { position: absolute; top: 0; }

    /* ---- 마우스를 쳐다보며 따라다니는 친구 ---- */
    .follower {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .follower.show { opacity: 1; }
    .follower svg { display: block; width: 100%; height: auto; overflow: visible; }

    @media (prefers-reduced-motion: reduce) {
      .cloud, .stars, .hop, .critter.walking .hop, .critter.talking .hop { animation: none; }
      .drop, .flake, .flash { display: none; }
      .bubble.show { animation: none; opacity: 1; transform: translateX(calc(-50% + var(--shift, 0px))); }
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    .subtitle { margin: 0 0 16px; font-size: 0.85rem; color: var(--muted); }
    form { display: flex; flex-wrap: wrap; gap: 8px; }
    input[type="text"], input[type="date"] {
      flex: 1;
      min-width: 0;
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--field);
      color: var(--text);
    }
    form input#input { flex: 1 1 160px; }
    form input#author { flex: 0 0 88px; }
    form input#due { flex: 0 0 auto; width: auto; color-scheme: light dark; }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .add {
      padding: 10px 20px;
      background: #2563eb;
      color: #fff;
      border-radius: 999px;
    }
    .add:hover:not(:disabled) { background: #1d4ed8; }
    .error {
      margin: 16px 0 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--danger-bg);
      color: var(--danger);
      font-size: 0.9rem;
      word-break: break-word;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 16px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .filters { display: flex; gap: 4px; }
    .filters button {
      padding: 4px 10px;
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
    }
    .filters button.active {
      color: var(--accent);
      border-color: var(--accent);
    }
    ul { list-style: none; margin: 8px 0 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    li > input[type="checkbox"] { width: 18px; height: 18px; flex: none; }
    li .text { flex: 1; word-break: break-word; cursor: text; }
    li.done .text { text-decoration: line-through; color: var(--muted); }
    li .due {
      flex: none;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
    }
    li .due.soon { color: var(--accent); font-weight: 600; }
    li .due.overdue { color: var(--danger); font-weight: 600; }
    li.done .due { color: var(--muted); font-weight: normal; }
    li .author {
      flex: none;
      max-width: 96px;
      padding: 2px 10px;
      border-radius: 999px;
      background: var(--bg);
      color: var(--muted);
      font-size: 0.8rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    li input.edit { padding: 4px 8px; }
    .delete {
      padding: 4px 10px;
      background: transparent;
      color: var(--danger);
    }
    .empty { margin: 16px 0 0; color: var(--muted); text-align: center; }
    .hint { margin: 16px 0 0; font-size: 0.8rem; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="stars"></div>
    <div class="sun"></div>
    <div class="moon"></div>
    <div id="clouds"></div>
    <svg class="hills" viewBox="0 0 1000 300" preserveAspectRatio="none">
      <path class="back" d="M0 120 C150 40 300 40 450 110 S800 30 1000 100 V300 H0 Z"/>
      <path class="front" d="M0 190 C200 120 380 150 560 180 S860 130 1000 170 V300 H0 Z"/>
    </svg>
    <div class="flowers"></div>
    <div class="tint"></div>
    <div id="critters"></div>
    <div id="weather-fx"></div>
    <div class="fog"></div>
  </div>
  <div id="rush" aria-hidden="true"></div>

  <div class="board">
  <aside id="weather" class="weather glass" aria-live="polite">
    <div id="weather-icon" class="weather-icon" aria-hidden="true">⏳</div>
    <div id="weather-temp" class="weather-temp">--°</div>
    <div id="weather-desc" class="weather-desc">날씨 불러오는 중</div>
    <div id="weather-meta" class="weather-meta">서울</div>
  </aside>

  <main>
    <h1>은혜 킴의 할 일 목록</h1>
    <p class="subtitle">은혜F의 할 일</p>
    <form id="form">
      <input id="input" type="text" placeholder="할 일을 입력하세요" autocomplete="off">
      <input id="author" type="text" placeholder="작성자" maxlength="20" autocomplete="off" aria-label="작성자 (선택)">
      <input id="due" type="date" aria-label="마감일 (선택)" title="마감일 (선택)">
      <button id="add" class="add" type="submit">추가</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <div class="toolbar">
      <span id="count"></span>
      <div class="filters">
        <button type="button" data-filter="all">전체</button>
        <button type="button" data-filter="active">진행 중</button>
        <button type="button" data-filter="done">완료</button>
      </div>
    </div>

    <ul id="list"></ul>
    <p id="empty" class="empty"></p>
    <p class="hint">글자를 더블클릭하면 수정할 수 있어요.</p>
  </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="critters.js"></script>
  <script src="sky.js"></script>
  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const authorInput = document.getElementById('author');
    const dueInput = document.getElementById('due');
    const addButton = document.getElementById('add');
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const count = document.getElementById('count');
    const errorBox = document.getElementById('error');
    const filterButtons = document.querySelectorAll('.filters button');

    let db = null;
    let todos = [];
    let filter = 'all';
    let loading = true;

    function showError(message, error) {
      errorBox.textContent = error ? `${message} (${error.message})` : message;
      errorBox.hidden = false;
      if (error) console.error(message, error);
    }

    function clearError() {
      errorBox.hidden = true;
      errorBox.textContent = '';
    }

    // RLS 때문에 막히면 오류 없이 0개만 바뀔 수 있어서, 바뀐 개수도 확인한다.
    function failed(message, { data, error }) {
      if (error) {
        showError(message, error);
        return true;
      }
      if (!data || data.length === 0) {
        showError(`${message} (권한이 없거나 이미 지워진 할 일이에요.)`);
        return true;
      }
      return false;
    }

    async function loadTodos() {
      loading = true;
      render();
      const { data, error } = await db
        .from('todos')
        .select('id, text, done, author, due_date');
      loading = false;
      if (error) {
        showError('할 일을 불러오지 못했어요.', error);
      } else {
        todos = data;
      }
      render();
    }

    async function addTodo(text, author, due_date) {
      clearError();
      addButton.disabled = true;
      const result = await db
        .from('todos')
        .insert({ text, author, due_date })
        .select('id, text, done, author, due_date');
      addButton.disabled = false;
      if (failed('할 일을 추가하지 못했어요.', result)) return false;
      todos.push(result.data[0]);
      render();
      window.critters?.rush();
      return true;
    }

    async function updateTodo(todo, changes, message) {
      clearError();
      const result = await db
        .from('todos')
        .update(changes)
        .eq('id', todo.id)
        .select('id');
      const ok = !failed(message, result);
      if (ok) Object.assign(todo, changes);
      render();
      return ok;
    }

    async function deleteTodo(todo) {
      clearError();
      const result = await db
        .from('todos')
        .delete()
        .eq('id', todo.id)
        .select('id');
      if (!failed('할 일을 지우지 못했어요.', result)) {
        todos = todos.filter((t) => t !== todo);
      }
      render();
    }

    function startEdit(item, label, todo) {
      const editor = document.createElement('input');
      editor.type = 'text';
      editor.className = 'edit';
      editor.value = todo.text;

      let finished = false;
      function finish(keep) {
        if (finished) return;
        finished = true;
        const text = editor.value.trim();
        if (keep && text && text !== todo.text) {
          updateTodo(todo, { text }, '할 일을 수정하지 못했어요.');
        } else {
          render();
        }
      }

      editor.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') finish(true);
        if (event.key === 'Escape') finish(false);
      });
      editor.addEventListener('blur', () => finish(true));

      item.replaceChild(editor, label);
      editor.focus();
      editor.select();
    }

    // 마감일이 가까운 순서, 마감일이 없으면 맨 아래. 같으면 먼저 만든 순서(id).
    function byDueDate(a, b) {
      if (a.due_date !== b.due_date) {
        if (!a.due_date) return 1;
        if (!b.due_date) return -1;
        return a.due_date < b.due_date ? -1 : 1;
      }
      return a.id - b.id;
    }

    function todayString() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
    }

    // 'YYYY-MM-DD' 두 날짜 사이의 날 수
    function daysBetween(from, to) {
      return (Date.parse(to) - Date.parse(from)) / 86400000;
    }

    function dueBadge(todo) {
      const [, month, day] = todo.due_date.split('-').map(Number);
      const days = daysBetween(todayString(), todo.due_date);
      const badge = document.createElement('span');
      badge.className = 'due';

      let when;
      if (days < 0) {
        when = `${-days}일 지남`;
        badge.classList.add('overdue');
      } else if (days === 0) {
        when = '오늘';
        badge.classList.add('soon');
      } else {
        when = `D-${days}`;
        if (days <= 2) badge.classList.add('soon');
      }

      badge.textContent = `${month}/${day} ${when}`;
      badge.title = `마감일: ${todo.due_date}`;
      return badge;
    }

    function render() {
      list.innerHTML = '';

      const visible = todos
        .filter((todo) =>
          filter === 'all' ? true : filter === 'done' ? todo.done : !todo.done
        )
        .sort(byDueDate);

      for (const todo of visible) {
        const item = document.createElement('li');
        item.classList.toggle('done', todo.done);

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.done;
        checkbox.addEventListener('change', async () => {
          const done = checkbox.checked;
          const ok = await updateTodo(todo, { done }, '완료 표시를 바꾸지 못했어요.');
          if (ok && done) window.critters?.cheer();
        });

        const label = document.createElement('span');
        label.className = 'text';
        label.textContent = todo.text;
        label.addEventListener('dblclick', () => startEdit(item, label, todo));

        item.append(checkbox, label);

        if (todo.due_date) item.append(dueBadge(todo));

        if (todo.author) {
          const author = document.createElement('span');
          author.className = 'author';
          author.textContent = todo.author;
          author.title = `작성자: ${todo.author}`;
          item.append(author);
        }

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'delete';
        remove.textContent = '삭제';
        remove.addEventListener('click', () => deleteTodo(todo));

        item.append(remove);
        list.append(item);
      }

      const remaining = todos.filter((todo) => !todo.done).length;
      count.textContent = `남은 할 일 ${remaining}개`;

      empty.hidden = visible.length > 0;
      empty.textContent =
        loading ? '불러오는 중...' :
        todos.length === 0 ? '아직 할 일이 없어요.' :
        filter === 'done' ? '완료한 일이 없어요.' : '남은 할 일이 없어요.';

      filterButtons.forEach((button) => {
        button.classList.toggle('active', button.dataset.filter === filter);
      });
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || !db) return;
      const author = authorInput.value.trim() || null;
      const dueDate = dueInput.value || null;
      if (await addTodo(text, author, dueDate)) {
        input.value = '';
        dueInput.value = '';
      }
      input.focus();
    });

    filterButtons.forEach((button) => {
      button.addEventListener('click', () => {
        filter = button.dataset.filter;
        render();
      });
    });

    if (!window.supabase) {
      loading = false;
      render();
      showError('Supabase 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
    } else if (typeof SUPABASE_URL === 'undefined') {
      loading = false;
      render();
      showError('config.js를 불러오지 못했어요.');
    } else {
      db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      loadTodos();
    }
  </script>
</body>
</html>
